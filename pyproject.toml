[project]
name = "filtered-block-pruning"
version = "0.1.0"
description = "Prototype of block pruning for tenant-filtered vector search."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.2.4",
    "pandas==2.2.3",
    "matplotlib==3.10.7",
    "scikit-learn==1.8.0",
    "scipy==1.16.3",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
